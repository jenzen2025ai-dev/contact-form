<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>課程報名</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      background: #e5ddd5; /* WhatsApp 背景色 */
    }

    .chat-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 130px;
      box-sizing: border-box;
    }

    /* 系統提示 */
    .system-wrapper {
      text-align: center;
      margin: 12px 0;
    }

    .system-msg {
      display: inline-block;
      background: #e2f4cb;
      color: #555;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 12px;
    }

    /* WhatsApp 氣泡（右側） */
    .bubble {
      background: #dcf8c6;
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 12px;
      max-width: 85%;
      margin-left: auto;
      position: relative;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    .bubble::after {
      content: "";
      position: absolute;
      right: -6px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid #dcf8c6;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: none;
      font-size: 16px;
      background: transparent;
      outline: none;
      resize: vertical;
    }

    textarea {
      min-height: 80px;
    }

    /* 費用提示 */
    #feeInfo {
      display: none;
      background: #fff3cd;
      color: #856404;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      white-space: pre-line;
    }

    /* 底部送出欄 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f0f0f0;
      padding: 12px 16px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
    }

    .send-btn {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: block;
      background: #25d366; /* WhatsApp 綠 */
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      padding: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    .send-btn:active {
      background: #1fa855;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: #333;
      margin-top: 10px;
    }

    /* 電腦版微調 */
    @media (min-width: 768px) {
      .chat-container {
        padding-bottom: 140px;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <div class="system-wrapper">
      <div class="system-msg">課程報名表單</div>
    </div>

    <form id="contactForm">
      <!-- 課程名稱 -->
      <div class="system-wrapper">
        <div class="system-msg">請選擇課程</div>
      </div>
      <div class="bubble">
        <select id="courseName" name="courseName" required>
          <option value="" disabled selected>請選擇課程</option>
          <option value="Summer Course">暑期課程</option>
          <option value="Activities">活動</option>
          <option value="Others">其他</option>
        </select>
      </div>

      <!-- 即時顯示費用 -->
      <div id="feeInfo"></div>

      <!-- 聯絡人 -->
      <div class="system-wrapper">
        <div class="system-msg">請輸入聯絡人姓名</div>
      </div>
      <div class="bubble">
        <input id="contactPerson" name="contactPerson" type="text" required placeholder="例如：陳大文" />
      </div>

      <!-- 聯絡電話 -->
      <div class="system-wrapper">
        <div class="system-msg">請輸入聯絡電話</div>
      </div>
      <div class="bubble">
        <input id="phone" name="phone" type="tel" placeholder="例如：6xxxxxxx" />
      </div>

      <!-- Email（選填） -->
      <div class="system-wrapper">
        <div class="system-msg">聯絡電郵（選填）</div>
      </div>
      <div class="bubble">
        <input id="email" name="email" type="email" placeholder="example@email.com" />
      </div>

      <!-- 諮詢內容 -->
      <div class="system-wrapper">
        <div class="system-msg">請輸入諮詢內容</div>
      </div>
      <div class="bubble">
        <textarea id="message" name="message" required placeholder="想了解課程內容、費用、時間等"></textarea>
      </div>
    </form>
  </div>

  <!-- 底部送出按鈕 -->
  <div class="bottom-bar">
    <button type="submit" form="contactForm" class="send-btn">送出</button>
    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("contactForm");
    const status = document.getElementById("status");
    const feeInfo = document.getElementById("feeInfo");
    const courseSelect = document.getElementById("courseName");

    // ✅ 課程費用表（可隨時改）
    const courseFees = {
      "Summer Course": "暑期課程費用：MOP 2,800\n（共8堂，每堂1.5小時）\n🎉 早鳥優惠：6月30日前報名減MOP 200",
      "Activities": "活動班費用：MOP 1,500（單次體驗）",
      "Others": "請在諮詢內容欄注明想了解嘅課程，我哋會盡快回覆。"
    };

    // ✅ 揀課程即時顯示費用
    courseSelect.addEventListener("change", function () {
      const selected = courseSelect.value;
      if (courseFees[selected]) {
        feeInfo.textContent = "💰 " + courseFees[selected];
        feeInfo.style.display = "block";
      } else {
        feeInfo.style.display = "none";
      }
    });

    // ✅ 送出表單
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbylhySw6oc5wkiZPoisLjabV2wKf2YbVNg5BC1wIH9N1dGIscVFgedWECR7jyTAk6Y_/exec";

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      status.textContent = "送出中...";

      const payload = {
        courseName: form.courseName.value,
        contactPerson: form.contactPerson.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        message: form.message.value.trim()
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
        .then(() => {
          status.textContent = "✅ 我哋已收到你嘅報名，稍後會 WhatsApp 聯絡你！";
          form.reset();
          feeInfo.style.display = "none";
          window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        })
        .catch(() => {
          status.textContent = "❌ 送出失敗，請稍後再試。";
        });
    });
  </script>

</body>
</html>
